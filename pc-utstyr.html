<!DOCTYPE html>
<html lang="no">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>PC-utstyr – finn billig i Norge</title>
<style>
  * { box-sizing: border-box; }
  body { margin: 0; font-family: 'Segoe UI', system-ui, sans-serif; background: #0f1220; color: #eef; }
  header { padding: 28px 16px 12px; text-align: center; background: linear-gradient(135deg, #1b2a6b, #5b2a86); }
  header h1 { margin: 0 0 6px; font-size: 2rem; }
  header p { margin: 0; opacity: .85; }
  main { max-width: 1000px; margin: 0 auto; padding: 16px; }
  .verktoy { display: flex; flex-wrap: wrap; gap: 10px; align-items: center; margin-bottom: 14px; }
  .chip { padding: 8px 16px; border-radius: 20px; border: 1px solid #3b4270; background: #181c33; color: #eef; cursor: pointer; font-size: 1rem; }
  .chip.valgt { background: #7c4dff; border-color: #7c4dff; }
  input[type=search] { flex: 1; min-width: 200px; padding: 10px 14px; border-radius: 10px; border: 1px solid #3b4270; background: #181c33; color: #eef; font-size: 1rem; }
  .boks { background: #181c33; border: 1px solid #2a3057; border-radius: 14px; padding: 14px 16px; margin-bottom: 16px; }
  .boks h2 { margin: 0 0 10px; font-size: 1.1rem; }
  .butikker { display: flex; flex-wrap: wrap; gap: 8px; }
  a.knapp { display: inline-block; padding: 8px 14px; border-radius: 8px; background: #2a3057; color: #fff; text-decoration: none; font-size: .95rem; }
  a.knapp:hover { background: #7c4dff; }
  a.pris { background: #00897b; }
  a.pris:hover { background: #00bfa5; }
  a.brukt { background: #ef6c00; }
  a.brukt:hover { background: #ff9800; }
  .rutenett { display: grid; grid-template-columns: repeat(auto-fill, minmax(260px, 1fr)); gap: 14px; }
  .kort { background: #181c33; border: 1px solid #2a3057; border-radius: 14px; padding: 14px; display: flex; flex-direction: column; gap: 8px; }
  .kort h3 { margin: 0; font-size: 1.05rem; }
  .kat { font-size: .75rem; text-transform: uppercase; letter-spacing: 1px; opacity: .65; }
  .info { font-size: .9rem; opacity: .85; flex: 1; }
  .sjekket { font-size: .85rem; color: #80cbc4; }
  .lenker { display: flex; flex-wrap: wrap; gap: 6px; }
  .lenker a.knapp { padding: 6px 10px; font-size: .85rem; }
  footer { text-align: center; padding: 24px 16px; opacity: .6; font-size: .85rem; }
</style>
</head>
<body>
<header>
  <h1>🖥️ Finn billig PC-utstyr i Norge</h1>
  <p>Mikrofon, headset, skjerm, skrivebord, tastatur og mus – med lenker til norske butikker</p>
</header>
<main>
  <div class="verktoy" id="kategorier"></div>

  <div class="boks">
    <h2>🔎 Søk i alle butikker</h2>
    <div class="verktoy">
      <input type="search" id="sok" placeholder="Hva leter du etter? F.eks. «gaming mus» eller «27 tommer skjerm»">
    </div>
    <div class="butikker" id="sokelenker"></div>
  </div>

  <div class="rutenett" id="produkter"></div>
</main>
<footer>
  Prisene skifter hele tiden. Trykk «Sammenlign priser» for å se dagens pris i butikkene.
  Siden er laget av en agent og er ikke tilknyttet noen butikk.
</footer>
<script>
const BUTIKKER = [
  { navn: 'Prisjakt', klasse: 'pris', url: q => 'https://www.prisjakt.no/search?search=' + q },
  { navn: 'Komplett', url: q => 'https://www.komplett.no/search?q=' + q },
  { navn: 'Elkjøp', url: q => 'https://www.elkjop.no/search?q=' + q },
  { navn: 'Power', url: q => 'https://www.power.no/search/?q=' + q },
  { navn: 'NetOnNet', url: q => 'https://www.netonnet.no/search?query=' + q },
  { navn: 'Proshop', url: q => 'https://www.proshop.no/?s=' + q },
  { navn: 'Finn.no (brukt)', klasse: 'brukt', url: q => 'https://www.finn.no/recommerce/forsale/search?q=' + q },
];

const KATEGORIER = ['Alle', 'Mikrofon', 'Headset', 'Skjerm', 'Skrivebord', 'Tastatur', 'Mus'];

// Pris vises bare når den er sjekket mot en norsk butikk.
const PRODUKTER = [
  { kat: 'Mikrofon', navn: 'Record MU-78 USB-mikrofon', info: 'Billigste USB-kondensatormikrofon. Plugg og spill.', pris: 'ca. 399 kr hos Dan Musikk', direkte: 'https://www.danmusikk.no/record-mu-78-usb-kondensator-mikrofon' },
  { kat: 'Mikrofon', navn: 'Razer Seiren V3 Mini', info: 'Kompakt, god stemme, dempeknapp og dempet tastaturstøy.', pris: 'ca. 547 kr hos Komplett', direkte: 'https://www.komplett.no/product/1312381/datautstyr/streaming/mikrofon/razer-seiren-v3-mini-usb-mikrofon-sort' },
  { kat: 'Mikrofon', navn: 'Fifine K669B', info: 'Populær og billig USB-mikrofon til vc og Discord.' },
  { kat: 'Headset', navn: 'HyperX Cloud Stinger 2', info: 'Lett og bekvemt gamingheadset med mikrofon.' },
  { kat: 'Headset', navn: 'Logitech G335', info: 'Lett headset med myke øreputer og mute-mikrofon.' },
  { kat: 'Headset', navn: 'Logitech H390 USB', info: 'Enkelt USB-headset til skole, jobb og møter.' },
  { kat: 'Skjerm', navn: 'AOC 24G2', info: '24" 144 Hz IPS. Kjent som en av de beste billige gamingskjermene.' },
  { kat: 'Skjerm', navn: 'Samsung Odyssey G3 24"', info: '24" 144 Hz gamingskjerm til lav pris.' },
  { kat: 'Skjerm', navn: 'LG 24MK430H', info: '24" IPS til hverdagsbruk og skole.' },
  { kat: 'Skrivebord', navn: 'IKEA Bekant skrivebord', info: 'Solid og rimelig skrivebord. Sjekk også brukt på Finn.no.' },
  { kat: 'Skrivebord', navn: 'IKEA Linnmon / Alex', info: 'Rimelig skrivebord med mye plass til PC-oppsett.' },
  { kat: 'Skrivebord', navn: 'Hev senk skrivebord', info: 'Elektrisk hev- og senkbart skrivebord for bedre arbeidsstilling.' },
  { kat: 'Tastatur', navn: 'Redragon K552', info: 'Mekanisk tastatur til lav pris.' },
  { kat: 'Tastatur', navn: 'Logitech K120', info: 'Enkelt og rimelig kontortastatur.' },
  { kat: 'Tastatur', navn: 'Logitech K400 Plus', info: 'Trådløst tastatur med innebygd styreflate.' },
  { kat: 'Mus', navn: 'Logitech G102', info: 'Billig og populær gamingmus.' },
  { kat: 'Mus', navn: 'Logitech M185', info: 'Billig trådløs mus til hverdagsbruk.' },
  { kat: 'Mus', navn: 'Razer DeathAdder Essential', info: 'Komfortabel gamingmus i lavere prisklasse.' },
];

let valgt = 'Alle';
const kategoriEl = document.getElementById('kategorier');
const produktEl = document.getElementById('produkter');
const sokEl = document.getElementById('sok');
const sokeLenkerEl = document.getElementById('sokelenker');

function lenkeKnapper(sokeord) {
  const q = encodeURIComponent(sokeord);
  return BUTIKKER.map(b => `<a class="knapp ${b.klasse || ''}" href="${b.url(q)}" target="_blank" rel="noopener">${b.navn}</a>`).join('');
}

function visKategorier() {
  kategoriEl.innerHTML = '';
  KATEGORIER.forEach(k => {
    const b = document.createElement('button');
    b.className = 'chip' + (k === valgt ? ' valgt' : '');
    b.textContent = k;
    b.onclick = () => { valgt = k; sokEl.value = ''; visKategorier(); visProdukter(); visSokeLenker(); };
    kategoriEl.appendChild(b);
  });
}

function visSokeLenker() {
  const tekst = sokEl.value.trim() || (valgt === 'Alle' ? 'pc utstyr' : valgt.toLowerCase());
  sokeLenkerEl.innerHTML = lenkeKnapper(tekst);
}

function visProdukter() {
  const sok = sokEl.value.trim().toLowerCase();
  const liste = PRODUKTER.filter(p =>
    (valgt === 'Alle' || p.kat === valgt) &&
    (!sok || (p.navn + ' ' + p.kat + ' ' + p.info).toLowerCase().includes(sok)));
  produktEl.innerHTML = liste.length ? liste.map(p => `
    <div class="kort">
      <div class="kat">${p.kat}</div>
      <h3>${p.navn}</h3>
      <div class="info">${p.info}</div>
      ${p.pris ? `<div class="sjekket">💰 ${p.pris}</div>` : ''}
      ${p.direkte ? `<div class="lenker"><a class="knapp pris" href="${p.direkte}" target="_blank" rel="noopener">Gå til butikken</a></div>` : ''}
      <div class="lenker">${lenkeKnapper(p.navn)}</div>
    </div>`).join('') : '<p>Ingen treff. Bruk søket over for å lete i butikkene.</p>';
}

sokEl.addEventListener('input', () => { visProdukter(); visSokeLenker(); });
visKategorier(); visProdukter(); visSokeLenker();
</script>
</body>
</html>
